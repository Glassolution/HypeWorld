; Sobrescreve só o que mudamos do BaseScalability.ini da engine (UE 5.8).

[ScalabilitySettings]
; Baixo preservado; Medio, Alto, Epico e Cinematico sempre em resolucao nativa.
PerfIndexValues_ResolutionQuality="50 100 100 100 100"

[ShadowQuality@1]
; Médio: 4 cascatas de 2048 em vez de 1 de 1024 deixam a sombra perto da câmera nítida, mas custaram +1,27 ms de ShadowDepths
; na GTX 1650 (25/10/2026). Desligado até decidir; tire o ';' das duas linhas abaixo para ligar.
;r.Shadow.CSM.MaxCascades=4
;r.Shadow.MaxCSMResolution=2048

; Base Alto aprovada em 26/10/2026. Tela e resolucao interna continuam 1920x1080 / 100%.
[AntiAliasingQuality@2]
r.TSR.History.R11G11B10=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=1
r.TSR.ShadingRejection.Flickering=0
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.ReprojectionField=0
r.TSR.Resurrection=1

[GlobalIlluminationQuality@2]
r.Lumen.FinalGatherMethod=0

[ShadowQuality@2]
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxCSMResolution=1536
r.Shadow.RadiusThreshold=0.06
r.Shadow.FilterMethod=1
r.DistanceFieldShadowing=1
